```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>SRVE Redirect</title>

  <script>
    // Replace with your real links
    const playStore =
        "https://play.google.com/store/apps/details?id=in.srve.delivery";

    const appStore =
      "https://apps.apple.com/in/app/srve-everything-meat/id6761304955";

    const website =
         "https://srve.in/";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    // Android
    if (/android/i.test(userAgent)) {
      window.location.href = playStore;
    }

    // iPhone/iPad
    else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location.href = appStore;
    }

    // Desktop/Web
    else {
      window.location.href = website;
    }
  </script>
</head>

<body>
  Redirecting to SRVE...
</body>
</html>
