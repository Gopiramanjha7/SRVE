<!DOCTYPE html>
<html>
<head>
  <title>SRVE App Redirect</title>

  <script>
    const androidLink =
       "https://play.google.com/store/apps/details?id=in.srve.delivery";

    const iosLink =
       "https://apps.apple.com/in/app/srve-everything-meat/id6761304955";

    const websiteLink =
      "https://srve.in";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(userAgent)) {
      window.location.href = androidLink;
    }
    else if (/iPad|iPhone|iPod/.test(userAgent)) {
      window.location.href = iosLink;
    }
    else {
      window.location.href = websiteLink;
    }
  </script>
</head>

<body>
  Redirecting...
</body>
</html>
